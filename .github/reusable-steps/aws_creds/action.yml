name: Configure AWS Credentials Using OIDC
description: Configure AWS credentials using GitHub OIDC and cross-account role chaining

inputs:
  target-role-arn:
    description: Target cross-account IAM role ARN
    required: true

  aws-region:
    description: AWS region
    required: true

runs:
  using: composite
  steps:

    - name: Show GitHub OIDC Claims
      shell: bash
      run: |
        OIDC_TOKEN=$(curl -sS \
          -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
          | jq -r '.value')

        PAYLOAD=$(echo "$OIDC_TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null)

        echo "$PAYLOAD" | jq '{iss, aud, sub}'

    - name: Configure Source AWS Credentials Using OIDC
      uses: aws-actions/configure-aws-credentials@v5
      with:
        role-to-assume: arn:aws:iam::648377377983:role/awsb73-github-actions-oidc-role
        role-session-name: github-actions-oidc-role
        aws-region: ${{ inputs.aws-region }}

    - name: Configure Target Cross Account Role
      uses: aws-actions/configure-aws-credentials@v5
      with:
        role-to-assume: ${{ inputs.target-role-arn }}
        role-session-name: github-actions-cross-account-role
        role-chaining: true
        aws-region: ${{ inputs.aws-region }}

    - name: Verify AWS Identity
      shell: bash
      run: aws sts get-caller-identity

# OIDC trust policy validation
# Batch 73 AWS OIDC Cross Account Authentication Flow
# GitHub OIDC -> Source AWS Role -> Target Cross Account Role -> Terraform