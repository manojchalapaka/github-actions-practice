name: Terraform Deployment Pipeline For AWS Batch 73

on:
  pull_request:
    types:
      - closed
    branches:
      - development
      - production
    paths-ignore:
      - 'ReadMe.md'

  push:
    branches:
      - development
      - production
    paths-ignore:
      - 'ReadMe.md'


env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  ENV_DESTROY: "YES"
  TERRAFORM_DESTROY: ${{ vars.TERRAFORM_DESTROY }}
  TERRAFORM_VERSION: "1.13.4"


jobs:
  terraform-checkov:
    if: ${{ vars.TERRAFORM_DESTROY == 'NO' }}
    name: 'Stage 1 - Checkov Security Scanning For Terraform Code'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Alpha-Bravo

    steps:
      - name: Checkout The Code Repository
        uses: actions/checkout@v5

      - name: Print Runner Hostname
        run: echo $HOSTNAME

      - name: Setup Checkov For Security Scanning
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./Alpha-Bravo
          quiet: true
          soft_fail: true
          output_format: cli,json
          output_file_path: console,./Alpha-Bravo/results.json

      - name: Upload Checkov Results to S3 Bucket
        uses: koraykoska/s3-upload-github-action@master
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          s3-endpoint: 's3.us-east-1.amazonaws.com'
          s3-bucket: "awsb73-terraform-modules-bucket"
          source-dir: './Alpha-Bravo/results.json'
          destination-dir: 'checkov-results/'