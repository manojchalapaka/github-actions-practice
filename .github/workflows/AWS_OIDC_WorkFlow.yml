name: Terraform Deployment Pipeline With OIDC & Reusable Workflows For Batch 73

# Variables needed: AWS_REGION, TERRAFORM_DESTROY, SOURCE_ROLE_ARN,
#                   DEV_TARGET_ROLE_ARN, PROD_TARGET_ROLE_ARN, CHECKOV_BUCKET
#
#   push to development -> Bravo (707256068335) -> Bravo.tfvars -> workspace dev
#   push to production  -> Alpha (886312446008) -> Alpha.tfvars -> workspace prod

on:
  push:
    branches: [development, production]
    paths-ignore: ['ReadMe.md']
  pull_request:
    types: [closed]
    branches: [production]
    paths-ignore: ['ReadMe.md']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-${{ github.base_ref || github.ref_name }}
  cancel-in-progress: false

env:
  TF_DIR: ./TerraformWorkspaces/Alpha-Bravo
  TERRAFORM_VERSION: "1.14.1"

jobs:
  prepare:
    name: Stage_0 - Resolve Target Environment
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    outputs:
      deploy: ${{ steps.resolve.outputs.deploy }}
      role_arn: ${{ steps.resolve.outputs.role_arn }}
      workspace: ${{ steps.resolve.outputs.workspace }}
      tfvars: ${{ steps.resolve.outputs.tfvars }}
      env_name: ${{ steps.resolve.outputs.env_name }}
    steps:
      - name: Resolve environment
        id: resolve
        shell: bash
        env:
          DEV_ROLE: ${{ vars.DEV_TARGET_ROLE_ARN }}
          PROD_ROLE: ${{ vars.PROD_TARGET_ROLE_ARN }}
        run: |
          set -e
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            BRANCH="$GITHUB_BASE_REF"
          else
            BRANCH="$GITHUB_REF_NAME"
          fi

          if [[ "$BRANCH" == "development" ]]; then
            {
              echo "deploy=true"
              echo "env_name=Bravo-dev"
              echo "workspace=dev"
              echo "tfvars=Bravo.tfvars"
              echo "role_arn=$DEV_ROLE"
            } >> "$GITHUB_OUTPUT"
          elif [[ "$BRANCH" == "production" ]]; then
            {
              echo "deploy=true"
              echo "env_name=Alpha-prod"
              echo "workspace=prod"
              echo "tfvars=Alpha.tfvars"
              echo "role_arn=$PROD_ROLE"
            } >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Not development or production. Nothing to do."
          fi
          echo "Resolved: $GITHUB_EVENT_NAME on $BRANCH"

  checkov:
    name: Stage_1 - Checkov
    needs: prepare
    if: ${{ needs.prepare.outputs.deploy == 'true' && vars.TERRAFORM_DESTROY == 'NO' }}
    uses: ./.github/workflows/reusable-checkov.yml
    with:
      source_role_arn: ${{ vars.SOURCE_ROLE_ARN }}
      target_role_arn: ${{ needs.prepare.outputs.role_arn }}
      aws_region: ${{ vars.AWS_REGION }}
      tf_dir: ${{ env.TF_DIR }}
      workspace: ${{ needs.prepare.outputs.workspace }}
      checkov_bucket: ${{ vars.CHECKOV_BUCKET }}

  validate:
    name: Stage_2 - Init, Format, Validate
    needs: [prepare, checkov]
    if: ${{ needs.prepare.outputs.deploy == 'true' && vars.TERRAFORM_DESTROY == 'NO' }}
    uses: ./.github/workflows/reusable-validate.yml
    with:
      source_role_arn: ${{ vars.SOURCE_ROLE_ARN }}
      target_role_arn: ${{ needs.prepare.outputs.role_arn }}
      aws_region: ${{ vars.AWS_REGION }}
      tf_dir: ${{ env.TF_DIR }}
      workspace: ${{ needs.prepare.outputs.workspace }}
      terraform_version: ${{ env.TERRAFORM_VERSION }}

  plan:
    name: Stage_3 - Plan
    needs: [prepare, validate]
    if: ${{ needs.prepare.outputs.deploy == 'true' && vars.TERRAFORM_DESTROY == 'NO' }}
    uses: ./.github/workflows/reusable-plan.yml
    with:
      source_role_arn: ${{ vars.SOURCE_ROLE_ARN }}
      target_role_arn: ${{ needs.prepare.outputs.role_arn }}
      aws_region: ${{ vars.AWS_REGION }}
      tf_dir: ${{ env.TF_DIR }}
      workspace: ${{ needs.prepare.outputs.workspace }}
      tfvars: ${{ needs.prepare.outputs.tfvars }}
      env_name: ${{ needs.prepare.outputs.env_name }}
      terraform_version: ${{ env.TERRAFORM_VERSION }}

  apply:
    name: Stage_4 - Apply
    needs: [prepare, plan]
    if: ${{ needs.prepare.outputs.deploy == 'true' && vars.TERRAFORM_DESTROY == 'NO' }}
    uses: ./.github/workflows/reusable-apply.yml
    with:
      source_role_arn: ${{ vars.SOURCE_ROLE_ARN }}
      target_role_arn: ${{ needs.prepare.outputs.role_arn }}
      aws_region: ${{ vars.AWS_REGION }}
      tf_dir: ${{ env.TF_DIR }}
      workspace: ${{ needs.prepare.outputs.workspace }}
      env_name: ${{ needs.prepare.outputs.env_name }}
      terraform_version: ${{ env.TERRAFORM_VERSION }}

  destroy:
    name: Stage_5 - Destroy
    needs: prepare
    if: ${{ needs.prepare.outputs.deploy == 'true' && vars.TERRAFORM_DESTROY == 'YES' }}
    uses: ./.github/workflows/reusable-destroy.yml
    with:
      source_role_arn: ${{ vars.SOURCE_ROLE_ARN }}
      target_role_arn: ${{ needs.prepare.outputs.role_arn }}
      aws_region: ${{ vars.AWS_REGION }}
      tf_dir: ${{ env.TF_DIR }}
      workspace: ${{ needs.prepare.outputs.workspace }}
      tfvars: ${{ needs.prepare.outputs.tfvars }}
      env_name: ${{ needs.prepare.outputs.env_name }}
      terraform_version: ${{ env.TERRAFORM_VERSION }}